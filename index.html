<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>奶蛙大吃小</title>
<style>
  /* 无滚动条、占满窗口，触屏不触发页面滚动/缩放 */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #AFD692;
  }
  body { position: fixed; inset: 0; }
  canvas {
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================
   奶蛙大吃小 —— 大鱼吃小鱼玩法
   · 奶蛙角色使用本地图片素材 assets/frog1-5.png（无外网资源）
   · 背景 / 气泡 / HUD / 特效由 Canvas2D 绘制
   · 零第三方库，鼠标 / 触屏均可操控，窗口自适应
   · 【技能1 闪电】每 30 秒一次，消灭场上最大的奶蛙（空格键）
   · 【技能2 爆炸】每 30 秒一次，范围内全部奶蛙炸飞（E 键）
   · 【无敌】开局 10 秒无敌护盾，撞到大奶蛙也不会死
   ============================================================ */

/* ===================== 配置常量（可自由调参） ===================== */
const PLAYER_START_SIZE = 30;    // 玩家初始体型（半径，px）
const MAX_WIN_SIZE      = 100;   // 通关所需最大体型
const GROW_RATE         = 2;     // 吞噬成长系数（越大长得越快）
const NPC_COUNT_MAX     = 20;    // 场上 NPC 奶蛙数量
const NPC_SPEED_BASE    = 1.5;   // NPC 移动速度基数
const PLAYER_SPEED_BASE = 4.5;   // 玩家移动速度基数
const EAT_RATIO         = 1.1;   // 体型比：比对方大 10% 以上才能吞噬，否则互相弹开
const COLLIDE_FACTOR    = 1.0;   // 碰撞判定半径系数（越小判定越宽松）
const PLAYER_VARIANT    = 1;     // 玩家奶蛙表情编号（1~5，对应 frog1-5.png）
const SHOW_DANGER_RING  = true;  // 是否给"比你大"的奶蛙画红色警示圈
const NPC_FLEE_RANGE    = 200;   // 小型奶蛙见到玩家后的逃跑距离
const NPC_SIZE_MIN      = 18;    // NPC 最小体型
const NPC_SIZE_MAX      = 80;    // NPC 最大体型

/* —— 【技能1 闪电】配置 —— */
const SKILL_COOLDOWN    = 30;    // 闪电技能冷却时间（秒）
const SKILL_START_READY = true;  // 开局是否直接可用（false = 开局也进入冷却）

/* —— 【新增：无敌护盾】配置 —— */
const PLAYER_INVINCIBLE_TIME = 10;   // 开局无敌时间（秒）

/* —— 【新增：爆炸技能】配置 —— */
const BOMB_COOLDOWN       = 30;   // 爆炸技能冷却时间（秒）
const BOMB_RADIUS         = 230;  // 爆炸基础半径（px，会按屏幕尺寸自动收缩）
const BOMB_READY_AT_START = true; // 爆炸技能开局是否直接可用
const BOMB_SCORE_RATE     = 10;   // 每个被炸奶蛙的得分系数（体型 × 该值）

/* —— 图片素材配置（全部为仓库内本地资源，无外网 URL） —— */
const FROG_SOURCES = [
  'assets/frog1.png',   // 1 大笑张嘴
  'assets/frog2.png',   // 2 眯眼微笑
  'assets/frog3.png',   // 3 严肃平静
  'assets/frog4.png',   // 4 惊讶睁大双眼
  'assets/frog5.png',   // 5 坏笑咧嘴
];
// 各素材中"蛙头朝向"的修正角（弧度）
const FROG_HEADINGS = [
  Math.PI / 2,   // frog1 大笑张嘴：素材蛙头朝上
  Math.PI / 2,   // frog2 眯眼微笑：预设朝上
  Math.PI / 2,   // frog3 严肃平静：预设朝上
  Math.PI / 2,   // frog4 惊讶：预设朝上
  Math.PI,       // frog5 坏笑咧嘴：预设朝左
];
const FROG_BODY_RATIO = 0.45;    // 蛙体半径占图片宽度的默认比例

/* ===================== 基础变量 ===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
const VARIANT_NAMES = ['大笑', '眯眼微笑', '严肃平静', '惊讶', '坏笑'];

let W = window.innerWidth, H = window.innerHeight;
let state = 'start';            // 'start' | 'playing' | 'gameover' | 'win'
let score = 0;
let time = 0, lastTime = 0;     // 全局时间（秒）
let gameStartTime = 0;          // 本局开始时间
let lastKiller = null;          // 吃掉玩家的凶手
let buttons = [];               // 当前帧按钮点击区
let particles = [], floatTexts = [];
let bubbles = [], weeds = [], pebbles = [];
let npcs = [];
let player = null;
const mouse = { x: 0, y: 0, active: false };
let screenFlash = 0;            // 【新增】全屏爆炸闪光强度 0~1

/* ===================== 素材预加载（含失败容错） ===================== */
const frogImages = [];
let assetsLoaded = 0;
let assetsReady = false;

function makeFallbackFrog(variant) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  const R = c.width * FROG_BODY_RATIO, cx = 256, cy = 256;
  c._ratio = FROG_BODY_RATIO; c._ox = 0; c._oy = 0; c._heading = 0;
  g.fillStyle = '#FFD34E';
  g.strokeStyle = 'rgba(160,110,30,0.5)';
  g.lineWidth = 8;
  g.beginPath(); g.ellipse(cx, cy, R * 1.02, R * 0.88, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,246,214,0.95)';
  g.beginPath(); g.ellipse(cx, cy + R * 0.38, R * 0.66, R * 0.44, 0, 0, Math.PI * 2); g.fill();
  for (const s of [-1, 1]) {
    g.fillStyle = '#FFFFFF';
    g.beginPath(); g.arc(cx + s * R * 0.48, cy - R * 0.62, R * 0.3, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2E2418';
    g.beginPath(); g.arc(cx + s * R * 0.48 + R * 0.05, cy - R * 0.62 + R * 0.03, R * 0.12, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = '#5A3E1B';
  g.lineWidth = R * 0.06;
  g.lineCap = 'round';
  g.beginPath(); g.arc(cx + R * 0.18, cy + R * 0.38, R * 0.2, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.font = 'bold 42px sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('V' + variant, cx, cy + R * 0.62);
  return c;
}

function calibrateFrog(img) {
  const fallback = { ratio: FROG_BODY_RATIO, ox: 0, oy: 0 };
  try {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return fallback;
    const probe = document.createElement('canvas');
    const scale = 96 / Math.max(w, h);
    probe.width = Math.max(1, Math.round(w * scale));
    probe.height = Math.max(1, Math.round(h * scale));
    const g = probe.getContext('2d');
    g.drawImage(img, 0, 0, probe.width, probe.height);
    const data = g.getImageData(0, 0, probe.width, probe.height).data;
    let x0 = probe.width, x1 = -1, y0 = probe.height, y1 = -1;
    for (let y = 0; y < probe.height; y++) {
      for (let x = 0; x < probe.width; x++) {
        if (data[(y * probe.width + x) * 4 + 3] > 16) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < x0) return fallback;
    const half = Math.max(x1 - x0, y1 - y0) / 2;
    return {
      ratio: half / probe.width,
      ox: (x0 + x1) / 2 / scale - w / 2,
      oy: (y0 + y1) / 2 / scale - h / 2,
    };
  } catch (e) {
    return fallback;
  }
}

function preloadAssets() {
  FROG_SOURCES.forEach((src, i) => {
    const img = new Image();
    frogImages[i] = img;
    img.onload = () => {
      Object.assign(img, calibrateFrog(img));
      img._heading = FROG_HEADINGS[i];
      assetsLoaded++;
      if (assetsLoaded === FROG_SOURCES.length) assetsReady = true;
    };
    img.onerror = () => {
      assetsLoaded++;
      frogImages[i] = makeFallbackFrog(i + 1);
      if (assetsLoaded === FROG_SOURCES.length) assetsReady = true;
    };
    img.src = src;
  });
}

// 绘制奶蛙图片：x,y 中心，size 为游戏体型半径，angle 朝向
function drawFrog(img, x, y, size, angle, t, breathPhase, pulse = 0, alpha = 1) {
  if (!img || !img.width) return;
  const ratio = img._ratio || FROG_BODY_RATIO;
  const dw = size / ratio;
  const dh = dw * (img.height / img.width);
  const k = dw / img.width;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + (img._heading || 0));
  const s = 1 + Math.sin(t * 3.5 + breathPhase) * 0.035 + pulse * 0.12;
  ctx.scale(s, s);
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, -dw / 2 + (img._ox || 0) * k, -dh / 2 + (img._oy || 0) * k, dw, dh);
  ctx.restore();
}

// 小皇冠
function drawCrown(x, y, s) {
  ctx.fillStyle = '#FFC93C';
  ctx.strokeStyle = '#D89A00';
  ctx.lineWidth = Math.max(1.5, s * 0.08);
  ctx.beginPath();
  ctx.moveTo(x - 0.4 * s, y + 0.12 * s);
  ctx.lineTo(x - 0.42 * s, y - 0.3 * s);
  ctx.lineTo(x - 0.16 * s, y - 0.02 * s);
  ctx.lineTo(x, y - 0.42 * s);
  ctx.lineTo(x + 0.16 * s, y - 0.02 * s);
  ctx.lineTo(x + 0.42 * s, y - 0.3 * s);
  ctx.lineTo(x + 0.4 * s, y + 0.12 * s);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FF6B6B';
  ctx.beginPath();
  ctx.arc(x, y - 0.04 * s, 0.09 * s, 0, TAU);
  ctx.fill();
}

/* ===================== 通用工具 ===================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
function normAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function getUiScale() { return clamp(Math.min(W, H) / 640, 0.62, 1.2); }
// 爆炸实际半径（小屏自动收缩，避免一炸全屏）
function getBombRadius() { return Math.min(BOMB_RADIUS, Math.min(W, H) * 0.55); }

/* ===================== 体型等级 ===================== */
const SIZE_LEVELS = [
  { min: 0,   name: '小小奶蛙' },
  { min: 55,  name: '成长奶蛙' },
  { min: 85,  name: '强壮奶蛙' },
  { min: 120, name: '奶蛙大佬' },
  { min: 150, name: '奶蛙霸王' },
];
function getLevel(size) {
  let idx = 0;
  for (let i = 0; i < SIZE_LEVELS.length; i++) if (size >= SIZE_LEVELS[i].min) idx = i;
  return { lv: idx + 1, name: SIZE_LEVELS[idx].name };
}

/* ===================== 场景装饰 ===================== */
function initScenery() {
  bubbles = [];
  const count = clamp(Math.round(W * H / 40000), 10, 30);
  for (let i = 0; i < count; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 2 + Math.random() * 7,
      speed: 15 + Math.random() * 45,
      phase: Math.random() * TAU,
      wob: 0.5 + Math.random() * 1.5,
      alpha: 0.25 + Math.random() * 0.5,
    });
  }
  weeds = [];
  const n = Math.max(6, Math.round(W / 140));
  for (let i = 0; i < n; i++) {
    weeds.push({
      x: clamp(W * (0.06 + 0.88 * i / n) + (Math.random() - 0.5) * 30, 20, W - 20),
      h: 50 + Math.random() * 110,
      phase: Math.random() * TAU,
      lw: 5 + Math.random() * 5,
      color: pick(['rgba(96,160,84,0.75)', 'rgba(76,142,72,0.7)', 'rgba(126,186,96,0.7)']),
    });
  }
  pebbles = [];
  for (let i = 0; i < 10; i++) {
    const rx = 8 + Math.random() * 18;
    pebbles.push({
      x: Math.random() * W,
      y: H * (0.9 + Math.random() * 0.09),
      rx, ry: rx * 0.55,
      color: pick(['rgba(150,170,120,0.55)', 'rgba(140,160,130,0.5)', 'rgba(170,180,140,0.5)']),
    });
  }
}
function updateBubbles(dt) {
  for (const b of bubbles) {
    b.y -= b.speed * dt;
    b.x += Math.sin(time * b.wob + b.phase) * 12 * dt;
    if (b.y < -b.r) { b.y = H + b.r; b.x = Math.random() * W; }
  }
}

/* ===================== 角色创建 ===================== */
function createPlayer() {
  return {
    x: W / 2, y: H / 2,
    size: PLAYER_START_SIZE,
    angle: 0,
    targetX: W / 2, targetY: H / 2,
    pulse: 0,
    breathPhase: Math.random() * TAU,
    skillCd: SKILL_START_READY ? 0 : SKILL_COOLDOWN,      // 闪电技能剩余冷却
    bombCd:  BOMB_READY_AT_START ? 0 : BOMB_COOLDOWN,      // 【新增】爆炸技能剩余冷却
    invincible: PLAYER_INVINCIBLE_TIME,                     // 【新增】无敌剩余时间
  };
}
function randomNpcSize() {
  const t = Math.pow(Math.random(), 1.6);
  return NPC_SIZE_MIN + t * (NPC_SIZE_MAX - NPC_SIZE_MIN);
}
function createNpc(awayFromPlayer) {
  let size = randomNpcSize();
  const safeDist = Math.min(240, Math.max(W, H) * 0.4) + size;
  let x = 0, y = 0, d = 0, tries = 0;
  do {
    x = size * 1.2 + Math.random() * Math.max(1, W - size * 2.4);
    y = size * 1.2 + Math.random() * Math.max(1, H - size * 2.4);
    d = Math.hypot(x - player.x, y - player.y);
    tries++;
  } while (tries < 14 && awayFromPlayer && d < safeDist);
  if (awayFromPlayer && d < 120 && size > player.size) size = player.size * 0.8;
  return {
    x, y, size,
    variant: Math.floor(Math.random() * 5),
    angle: Math.random() * TAU,
    speed: NPC_SPEED_BASE * (60 / size) * 60,
    breathPhase: Math.random() * TAU,
    wobblePhase: Math.random() * TAU,
    spawnT: 0,
  };
}

/* ===================== 粒子特效 ===================== */
function spawnBurst(x, y, color, count = 16) {
  particles.push({ type: 'ring', x, y, r: 6, vr: 140, life: 0.35, maxLife: 0.35, color });
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const sp = 60 + Math.random() * 170;
    particles.push({
      type: 'dot', x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 2 + Math.random() * 3.5,
      life: 0.4 + Math.random() * 0.35, maxLife: 0.75,
      color: Math.random() < 0.5 ? color : '#FFFFFF',
    });
  }
}

/* —— 【新增】爆炸特效：多层冲击环 + 火焰碎片 + 全屏闪光 —— */
function spawnExplosion(x, y, radius) {
  // 三层扩散冲击环（白 → 金 → 橙红）
  particles.push({ type: 'ring', x, y, r: radius * 0.12, vr: radius * 3.4, life: 0.5,  maxLife: 0.5,  color: '#FFFFFF' });
  particles.push({ type: 'ring', x, y, r: radius * 0.22, vr: radius * 2.3, life: 0.72, maxLife: 0.72, color: '#FFC93C' });
  particles.push({ type: 'ring', x, y, r: radius * 0.32, vr: radius * 1.5, life: 1.0,  maxLife: 1.0,  color: '#FF6B3D' });
  particles.push({ type: 'ring', x, y, r: radius * 0.42, vr: radius * 1.0, life: 1.25, maxLife: 1.25, color: 'rgba(255,120,60,0.7)' });
  // 火焰碎片
  const fireColors = ['#FFF3B0', '#FFD34E', '#FFA726', '#FF7043', '#FF5722'];
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * TAU;
    const sp = radius * (0.7 + Math.random() * 3.4);
    particles.push({
      type: 'dot', x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 3 + Math.random() * 6,
      life: 0.45 + Math.random() * 0.55, maxLife: 1.0,
      color: pick(fireColors),
    });
  }
  // 全屏暖色闪光
  screenFlash = 0.85;
}

function spawnConfetti() {
  const colors = ['#FFD34E', '#7CB342', '#FF8FA3', '#FFFFFF', '#4FC3F7', '#FFB300'];
  for (let i = 0; i < 90; i++) {
    particles.push({
      type: 'confetti',
      x: Math.random() * W,
      y: -20 - Math.random() * H * 0.4,
      vx: (Math.random() - 0.5) * 40,
      vy: 60 + Math.random() * 130,
      rot: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 6,
      r: 3 + Math.random() * 4,
      life: 4, maxLife: 4,
      color: pick(colors),
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.type === 'dot') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 90 * dt;
    } else if (p.type === 'ring') {
      p.r += p.vr * dt;
    } else if (p.type === 'confetti') {
      p.x += p.vx * dt + Math.sin(time * 3 + p.rot) * 30 * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > H + 20) p.life = 0;
    }
    // 'bolt'（闪电）不需要更新坐标
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= dt * 0.8;
    f.y -= 46 * dt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
}

/* ===================== 输入 ===================== */
function setPlayerTarget(e) {
  player.targetX = e.clientX;
  player.targetY = e.clientY - (e.pointerType === 'touch' ? 70 : 0);
}
canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  setPlayerTarget(e);
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  if (state === 'start') {
    if (assetsReady) startGame();
  } else if (state === 'gameover' || state === 'win') {
    for (const b of buttons) {
      if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
        restart();
        break;
      }
    }
  } else if (state === 'playing') {
    // 点击右下角技能按钮（闪电 / 爆炸），不改变移动目标
    for (const b of buttons) {
      if (!b.skill) continue;
      if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
        if (b.skill === 'bolt') useSkill();
        else if (b.skill === 'bomb') useBomb();
        return;
      }
    }
  }
  setPlayerTarget(e);
});
window.addEventListener('keydown', e => {
  // 【游戏中】空格 = 闪电，E = 爆炸
  if (state === 'playing') {
    if (e.code === 'Space') { e.preventDefault(); useSkill(); return; }
    if (e.code === 'KeyE')  { e.preventDefault(); useBomb();  return; }
  }
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'playing' && assetsReady) {
    e.preventDefault();
    if (state === 'start') startGame(); else restart();
  }
});
window.addEventListener('resize', onResize);

/* ===================== 游戏流程 ===================== */
function startGame() { restart(); }

function restart() {
  score = 0;
  lastKiller = null;
  screenFlash = 0;
  player = createPlayer();
  npcs = [];
  for (let i = 0; i < NPC_COUNT_MAX; i++) npcs.push(createNpc(true));
  particles = [];
  floatTexts = [];
  gameStartTime = time;
  state = 'playing';
}

/* ===================== 技能1：雷霆一击（消灭最大奶蛙） ===================== */
function useSkill() {
  if (state !== 'playing' || !player) return false;
  if (player.skillCd > 0) return false;
  if (!npcs.length) return false;

  let target = null;
  for (const n of npcs) {
    if (!target || n.size > target.size) target = n;
  }
  if (!target) return false;

  player.skillCd = SKILL_COOLDOWN;

  // 玩家 → 目标的闪电链
  particles.push({
    type: 'bolt',
    x1: player.x, y1: player.y,
    x2: target.x, y2: target.y,
    life: 0.32, maxLife: 0.32,
  });
  spawnBurst(target.x, target.y, '#5FD8FF', 34);
  particles.push({ type: 'ring', x: target.x, y: target.y, r: target.size * 0.5, vr: 460, life: 0.6, maxLife: 0.6, color: '#B3F0FF' });
  particles.push({ type: 'ring', x: player.x, y: player.y, r: player.size * 0.9, vr: 320, life: 0.4, maxLife: 0.4, color: '#9AE6FF' });

  const pts = Math.round(target.size * 10);
  score += pts;
  floatTexts.push({ x: target.x, y: target.y - target.size * 0.8, text: '消灭 +' + pts, life: 1.3 });

  Object.assign(target, createNpc(true));
  return true;
}

/* ===================== 【新增】技能2：烈焰爆炸（范围内全部炸飞） =====================
   效果：以玩家为中心引爆，半径内所有奶蛙（不论大小）全部被炸飞并计分
   冷却：BOMB_COOLDOWN 秒（默认 30）
   触发：按 E 键 / 点击右下角爆炸按钮
   ================================================================================ */
function useBomb() {
  if (state !== 'playing' || !player) return false;
  if (player.bombCd > 0) return false;

  player.bombCd = BOMB_COOLDOWN;

  const cx = player.x, cy = player.y;
  const R = getBombRadius();

  // 1. 爆炸视觉特效 + 全屏闪光
  spawnExplosion(cx, cy, R);

  // 2. 清理半径内的所有 NPC
  let killed = 0, totalPts = 0;
  for (const n of npcs) {
    const d = Math.hypot(n.x - cx, n.y - cy);
    if (d <= R + n.size * 0.6) {
      const pts = Math.round(n.size * BOMB_SCORE_RATE);
      totalPts += pts;
      killed++;
      // 被炸飞的个体小爆炸
      spawnBurst(n.x, n.y, '#FF7043', 8);
      floatTexts.push({ x: n.x, y: n.y - n.size * 0.8, text: '+' + pts, life: 1 });
      // 原地重生，保持场上数量
      Object.assign(n, createNpc(true));
    }
  }

  if (killed > 0) {
    score += totalPts;
    floatTexts.push({
      x: cx, y: cy - player.size * 2.2,
      text: '爆炸！消灭 ' + killed + ' 只 +' + totalPts,
      life: 1.6,
    });
  } else {
    floatTexts.push({
      x: cx, y: cy - player.size * 2.2,
      text: '爆炸！',
      life: 1.2,
    });
  }
  return true;
}

/* ===================== 更新逻辑 ===================== */
function update(dt) {
  time += dt;
  updateBubbles(dt);
  updateParticles(dt);
  // 全屏闪光衰减（任何状态下都衰减）
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 2.6);

  if (player) {
    player.pulse = Math.max(0, player.pulse - dt * 2.5);
    player.skillCd    = Math.max(0, player.skillCd - dt);      // 闪电冷却
    player.bombCd     = Math.max(0, player.bombCd - dt);       // 【新增】爆炸冷却
    player.invincible = Math.max(0, player.invincible - dt);   // 【新增】无敌倒计时
  }
  if (state !== 'playing') return;

  updatePlayer(dt);
  updateNpcs(dt);
  handleCollisions();
}

function updatePlayer(dt) {
  const spd = PLAYER_SPEED_BASE * Math.pow(50 / player.size, 0.7) * 60;
  const dx = player.targetX - player.x;
  const dy = player.targetY - player.y;
  const d = Math.hypot(dx, dy);
  if (d > 1) {
    const step = Math.min(d, spd * dt);
    player.x += dx / d * step;
    player.y += dy / d * step;
    const targetAngle = Math.atan2(dy, dx);
    player.angle += normAngle(targetAngle - player.angle) * Math.min(1, 12 * dt);
  }
  player.x = clamp(player.x, 10, W - 10);
  player.y = clamp(player.y, 10, H - 10);
}

function updateNpcs(dt) {
  for (let i = 0; i < npcs.length; i++) {
    for (let j = i + 1; j < npcs.length; j++) {
      const a = npcs[i], b = npcs[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minD = (a.size + b.size) * 0.55;
      if (d < minD && d > 0.001) {
        const push = (minD - d) / 2;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
      }
    }
  }

  for (const n of npcs) {
    n.spawnT = Math.min(1, n.spawnT + dt * 3);
    n.x += Math.cos(n.angle) * n.speed * dt;
    n.y += Math.sin(n.angle) * n.speed * dt;
    n.angle += Math.sin(time * 1.4 + n.wobblePhase) * 0.45 * dt;
    if (n.size < player.size * EAT_RATIO) {
      const dpx = n.x - player.x, dpy = n.y - player.y;
      const dp = Math.hypot(dpx, dpy);
      if (dp < NPC_FLEE_RANGE) {
        const fleeA = Math.atan2(dpy, dpx);
        const diff = normAngle(fleeA - n.angle);
        n.angle += clamp(diff, -1, 1) * 3 * dt;
      }
    }
    const m = n.size * 1.1;
    if (n.x < m) { n.x = m; n.angle = Math.PI - n.angle + (Math.random() - 0.5) * 0.7; }
    else if (n.x > W - m) { n.x = W - m; n.angle = Math.PI - n.angle + (Math.random() - 0.5) * 0.7; }
    if (n.y < m) { n.y = m; n.angle = -n.angle + (Math.random() - 0.5) * 0.7; }
    else if (n.y > H - m) { n.y = H - m; n.angle = -n.angle + (Math.random() - 0.5) * 0.7; }
  }
}

// 核心碰撞规则：大吃小、小被吃、体型接近互相弹开；【无敌期间不会死亡】
function handleCollisions() {
  for (const n of npcs) {
    if (n.spawnT < 0.5) continue;
    const dx = n.x - player.x, dy = n.y - player.y;
    const d = Math.hypot(dx, dy);
    const hit = (player.size + n.size) * COLLIDE_FACTOR;
    if (d >= hit) continue;
    if (player.size >= n.size * EAT_RATIO) {
      eatNpc(n);
      if (state !== 'playing') break;
    } else if (n.size >= player.size * EAT_RATIO) {
      // 【新增】无敌护盾生效中：只弹开，不会死亡
      if (player.invincible > 0) {
        bouncePlayerNpc(n);
        // 无敌期间撞大奶蛙给一点视觉反馈
        if (Math.random() < 0.35) {
          spawnBurst(
            (player.x + n.x) / 2, (player.y + n.y) / 2,
            '#FFD34E', 6
          );
        }
      } else {
        die(n);
        return;
      }
    } else {
      bouncePlayerNpc(n);
    }
  }
}

function eatNpc(n) {
  const pts = Math.round(n.size * 10);
  score += pts;
  player.size = Math.min(player.size + GROW_RATE * (n.size / PLAYER_START_SIZE), MAX_WIN_SIZE);
  player.pulse = 1;
  spawnBurst(n.x, n.y, '#FFE57A');
  floatTexts.push({ x: n.x, y: n.y - n.size, text: '+' + pts, life: 1 });
  Object.assign(n, createNpc(true));
  if (player.size >= MAX_WIN_SIZE) {
    state = 'win';
    spawnConfetti();
  }
}

function die(n) {
  lastKiller = { variant: n.variant, size: Math.round(n.size) };
  spawnBurst(player.x, player.y, '#FF8A80', 26);
  state = 'gameover';
}

function bouncePlayerNpc(n) {
  const dx = n.x - player.x, dy = n.y - player.y;
  const d = Math.hypot(dx, dy) || 0.001;
  const overlap = (player.size + n.size) * COLLIDE_FACTOR - d;
  player.x -= dx / d * overlap * 0.5;
  player.y -= dy / d * overlap * 0.5;
  n.x += dx / d * overlap * 0.5;
  n.y += dy / d * overlap * 0.5;
  n.angle = Math.atan2(dy / d, dx / d) + (Math.random() - 0.5) * 0.8;
}

/* ===================== 绘制 ===================== */
function draw() {
  buttons = [];
  drawBackground();
  if (state !== 'start') {
    for (const n of npcs) drawNpc(n);
    if (state !== 'gameover') drawPlayer();
  }
  drawParticles();
  drawFloatTexts();

  // 【新增】全屏爆炸闪光（在 HUD 下方，避免遮挡按钮）
  if (screenFlash > 0) {
    ctx.fillStyle = `rgba(255,222,150,${(screenFlash * 0.6).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'playing') drawHUD();
  else if (state === 'start') drawStart();
  else if (state === 'gameover') drawGameOver();
  else drawWin();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#DCF2C6');
  g.addColorStop(0.6, '#C9E7AE');
  g.addColorStop(1, '#AFD692');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const lg = ctx.createRadialGradient(W / 2, -H * 0.15, 10, W / 2, -H * 0.15, H * 0.9);
  lg.addColorStop(0, 'rgba(255,255,240,0.35)');
  lg.addColorStop(1, 'rgba(255,255,240,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);
  for (const p of pebbles) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU);
    ctx.fill();
  }
  ctx.lineCap = 'round';
  for (const wd of weeds) {
    const sway = Math.sin(time * 1.1 + wd.phase) * 14;
    ctx.strokeStyle = wd.color;
    ctx.lineWidth = wd.lw;
    ctx.beginPath();
    ctx.moveTo(wd.x, H);
    ctx.quadraticCurveTo(wd.x + sway, H - wd.h * 0.55, wd.x - sway * 0.7, H - wd.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(wd.x + wd.lw * 3, H);
    ctx.quadraticCurveTo(wd.x + wd.lw * 3 - sway * 0.5, H - wd.h * 0.45, wd.x + wd.lw * 3 + sway, H - wd.h * 0.8);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  for (const b of bubbles) {
    ctx.globalAlpha = b.alpha;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.22, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawNpc(n) {
  if (SHOW_DANGER_RING && state === 'playing' && n.size > player.size * EAT_RATIO) {
    const pulse = 0.3 + 0.18 * Math.sin(time * 5 + n.breathPhase);
    const r = n.size * 1.22 + Math.sin(time * 4 + n.breathPhase) * 2;
    ctx.strokeStyle = `rgba(255,72,72,${pulse.toFixed(3)})`;
    ctx.lineWidth = Math.max(2, n.size * 0.05);
    ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const spawnScale = 0.35 + 0.65 * Math.min(1, n.spawnT);
  drawFrog(frogImages[n.variant], n.x, n.y, n.size * spawnScale, n.angle, time, n.breathPhase, 0, Math.min(1, n.spawnT * 2));
}

function drawPlayer() {
  // 白色光晕突出玩家
  const g = ctx.createRadialGradient(player.x, player.y, player.size * 0.4, player.x, player.y, player.size * 1.5);
  g.addColorStop(0, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size * 1.5, 0, TAU);
  ctx.fill();

  drawFrog(frogImages[PLAYER_VARIANT - 1], player.x, player.y, player.size, player.angle, time, player.breathPhase, player.pulse);

  // 【新增】无敌护盾
  drawInvincibleShield();

  if (player.size >= MAX_WIN_SIZE * 0.85) {
    drawCrown(player.x, player.y - player.size * 0.95, player.size * 0.42);
  }
}

/* —— 【新增】开局无敌护盾绘制 —— */
function drawInvincibleShield() {
  const t = player.invincible;
  if (t <= 0) return;

  const ui = getUiScale();
  const R = player.size * 1.42;
  // 最后 3 秒加速闪烁，提示即将失效
  const blinkSpeed = t < 3 ? 16 : 6;
  const alpha = clamp(0.45 + 0.4 * Math.sin(time * blinkSpeed), 0.15, 0.9);

  ctx.save();
  ctx.translate(player.x, player.y);

  // 外圈金色旋转虚线环
  ctx.rotate(time * 1.9);
  ctx.strokeStyle = `rgba(255,214,80,${alpha.toFixed(3)})`;
  ctx.lineWidth = Math.max(2, player.size * 0.09);
  ctx.setLineDash([player.size * 0.55, player.size * 0.34]);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);

  // 内圈白色细环（反向旋转）
  ctx.rotate(-time * 3.6);
  ctx.strokeStyle = `rgba(255,255,255,${(alpha * 0.75).toFixed(3)})`;
  ctx.lineWidth = Math.max(1.5, player.size * 0.045);
  ctx.setLineDash([player.size * 0.25, player.size * 0.3]);
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.87, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineCap = 'butt';

  // 柔光
  const gg = ctx.createRadialGradient(0, 0, R * 0.55, 0, 0, R * 1.25);
  gg.addColorStop(0, 'rgba(255,228,120,0)');
  gg.addColorStop(1, `rgba(255,228,120,${(alpha * 0.28).toFixed(3)})`);
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, R * 1.25, 0, TAU);
  ctx.fill();

  ctx.restore();

  // 剩余秒数文字
  ctx.font = `bold ${Math.round(13 * ui)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const txt = '无敌 ' + t.toFixed(1) + 's';
  const ty = player.y - player.size * 1.85;
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeText(txt, player.x, ty);
  ctx.fillStyle = '#C48A00';
  ctx.fillText(txt, player.x, ty);
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    if (p.type === 'ring') {
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 + 5 * a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.stroke();
    } else if (p.type === 'dot') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, TAU);
      ctx.fill();
    } else if (p.type === 'bolt') {
      /* 闪电链：玩家 → 目标，带随机折线抖动 */
      const segs = 7;
      ctx.globalAlpha = a;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(90,210,255,0.85)';
      ctx.lineWidth = 12 * a;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const jitter = Math.sin(t * Math.PI) * 26;
        ctx.lineTo(
          p.x1 + (p.x2 - p.x1) * t + (Math.random() - 0.5) * jitter,
          p.y1 + (p.y2 - p.y1) * t + (Math.random() - 0.5) * jitter
        );
      }
      ctx.lineTo(p.x2, p.y2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 4 * a;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const jitter = Math.sin(t * Math.PI) * 20;
        ctx.lineTo(
          p.x1 + (p.x2 - p.x1) * t + (Math.random() - 0.5) * jitter,
          p.y1 + (p.y2 - p.y1) * t + (Math.random() - 0.5) * jitter
        );
      }
      ctx.lineTo(p.x2, p.y2);
      ctx.stroke();
      ctx.lineCap = 'butt';
    } else {
      ctx.globalAlpha = Math.min(1, p.life / 1.5);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  const ui = getUiScale();
  ctx.font = `bold ${Math.round(16 * ui)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floatTexts) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#33691E';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ===================== HUD ===================== */
function drawHUD() {
  const ui = getUiScale();
  const pad = 14 * ui;
  const ph = 40 * ui;
  const iconR = ph * 0.34;

  /* —— 得分（左上） —— */
  const scoreText = '得分 ' + score;
  ctx.font = `bold ${Math.round(17 * ui)}px ${FONT}`;
  const tw = ctx.measureText(scoreText).width;
  const w1 = tw + iconR * 2.2 + 26 * ui;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  rr(pad, pad, w1, ph, ph / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(110,160,70,0.5)';
  ctx.lineWidth = 2;
  rr(pad, pad, w1, ph, ph / 2); ctx.stroke();
  drawFrog(frogImages[0], pad + ph * 0.52, pad + ph * 0.5, iconR, 0, time, 0);
  ctx.fillStyle = '#33691E';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(scoreText, pad + ph * 0.52 + iconR * 1.5, pad + ph * 0.5 + 1);

  /* —— 体型等级（右上） —— */
  const lvl = getLevel(player.size);
  const lvlText = `Lv.${lvl.lv} ${lvl.name} · ${Math.round(player.size)}/${MAX_WIN_SIZE}`;
  ctx.font = `bold ${Math.round(16 * ui)}px ${FONT}`;
  const tw2 = ctx.measureText(lvlText).width;
  const w2 = tw2 + 30 * ui;
  const x2 = W - pad - w2;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  rr(x2, pad, w2, ph, ph / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(110,160,70,0.5)';
  rr(x2, pad, w2, ph, ph / 2); ctx.stroke();
  ctx.fillStyle = '#33691E';
  ctx.textAlign = 'left';
  ctx.fillText(lvlText, x2 + 15 * ui, pad + ph * 0.5 + 1);

  /* —— 成长进度条（顶部中央） —— */
  const bw = Math.min(320 * ui, W * 0.4);
  const bx = W / 2 - bw / 2;
  const by = pad + ph + 10 * ui;
  const bh = 10 * ui;
  const prog = clamp((player.size - PLAYER_START_SIZE) / (MAX_WIN_SIZE - PLAYER_START_SIZE), 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  rr(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(110,160,70,0.5)';
  ctx.lineWidth = 2;
  rr(bx, by, bw, bh, bh / 2); ctx.stroke();
  if (prog > 0) {
    const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    pg.addColorStop(0, '#FFE57A');
    pg.addColorStop(1, '#FF9F1C');
    ctx.fillStyle = pg;
    rr(bx, by, Math.max(bw * prog, bh), bh, bh / 2); ctx.fill();
  }
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = '#E8A200';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(bx + bw * prog, by + bh / 2, bh * 0.85, 0, TAU);
  ctx.fill();
  ctx.stroke();

  /* —— 新手提示（10 秒后或首次成长后消失） —— */
  if (player.size < PLAYER_START_SIZE + 8) {
    const a = clamp(1 - (time - gameStartTime) / 10, 0, 1);
    if (a > 0) {
      ctx.globalAlpha = a * 0.9;
      ctx.font = `bold ${Math.round(14 * ui)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeText('吃掉比你小的奶蛙 · 躲开带红色光环的大奶蛙', W / 2, H - 40 * ui);
      ctx.fillStyle = '#2F5D24';
      ctx.fillText('吃掉比你小的奶蛙 · 躲开带红色光环的大奶蛙', W / 2, H - 40 * ui);
      ctx.globalAlpha = 1;
    }
  }

  /* —— 右下角技能按钮（闪电 + 爆炸） —— */
  drawSkillButtons();
}

/* —— 技能按钮通用绘制 —— */
function drawSkillButtonAt(cx, cy, r, cfg) {
  const ui = getUiScale();
  buttons.push({ x: cx - r, y: cy - r, w: r * 2, h: r * 2, skill: cfg.id });

  const ready = cfg.cd <= 0;
  const prog = ready ? 1 : 1 - cfg.cd / cfg.total;
  const hover = mouse.active && Math.hypot(mouse.x - cx, mouse.y - cy) <= r * 1.1;

  // 就绪光晕
  if (ready) {
    const glow = r * 1.5 + Math.sin(time * 4) * 6 * ui;
    const gg = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, glow);
    gg.addColorStop(0, cfg.glow);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(cx, cy, glow, 0, TAU); ctx.fill();
  }

  // 底盘
  ctx.fillStyle = ready ? (hover ? '#FFFFFF' : 'rgba(255,255,255,0.94)') : 'rgba(228,236,222,0.88)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = ready ? cfg.color : 'rgba(120,145,110,0.55)';
  ctx.lineWidth = 3 * ui;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();

  // 冷却进度环
  if (!ready) {
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = 4 * ui;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2 * ui, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (ready) {
    cfg.drawIcon(cx, cy, r);
    ctx.fillStyle = cfg.color;
    ctx.font = `bold ${Math.round(10 * ui)}px ${FONT}`;
    ctx.fillText(cfg.hint, cx, cy + r + 10 * ui);
  } else {
    ctx.fillStyle = '#4E7A46';
    ctx.font = `bold ${Math.round(19 * ui)}px ${FONT}`;
    ctx.fillText(String(Math.ceil(cfg.cd)), cx, cy + 1);
    ctx.fillStyle = '#6B8A5E';
    ctx.font = `bold ${Math.round(10 * ui)}px ${FONT}`;
    ctx.fillText('冷却中', cx, cy + r + 10 * ui);
  }
}

function drawSkillButtons() {
  const ui = getUiScale();
  const r = 30 * ui;
  const cy = H - r - 30 * ui;
  const cx1 = W - r - 14 * ui;                 // 闪电（最右）
  const cx2 = cx1 - r * 2 - 12 * ui;           // 爆炸（左边）

  // 闪电按钮
  drawSkillButtonAt(cx1, cy, r, {
    id: 'bolt',
    cd: player.skillCd,
    total: SKILL_COOLDOWN,
    color: '#0FA3C9',
    glow: 'rgba(120,226,255,0.5)',
    hint: '空格',
    drawIcon: drawBoltIcon,
  });

  // 爆炸按钮
  drawSkillButtonAt(cx2, cy, r, {
    id: 'bomb',
    cd: player.bombCd,
    total: BOMB_COOLDOWN,
    color: '#F4511E',
    glow: 'rgba(255,150,90,0.5)',
    hint: 'E 键',
    drawIcon: drawBombIcon,
  });
}

function drawBoltIcon(cx, cy, r) {
  const ic = r * 0.58;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#0FA3C9';
  ctx.beginPath();
  ctx.moveTo(ic * 0.22, -ic);
  ctx.lineTo(-ic * 0.50, ic * 0.10);
  ctx.lineTo(-ic * 0.06, ic * 0.10);
  ctx.lineTo(-ic * 0.22, ic);
  ctx.lineTo(ic * 0.52, -ic * 0.12);
  ctx.lineTo(ic * 0.06, -ic * 0.12);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* —— 【新增】爆炸图标：八角星火花 —— */
function drawBombIcon(cx, cy, r) {
  const ic = r * 0.62;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#F4511E';
  const spikes = 8;
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const rad = (i % 2 === 0) ? ic : ic * 0.42;
    const a = (i / (spikes * 2)) * TAU - Math.PI / 2;
    const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFD34E';
  ctx.beginPath();
  ctx.arc(0, 0, ic * 0.33, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ===================== 三个界面 ===================== */
function drawStart() {
  const ui = getUiScale();
  const compact = H < 560;

  const ty = H * 0.17 + Math.sin(time * 1.6) * 7;
  ctx.font = `bold ${Math.round(Math.min(64, W * 0.12))}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#3E7C2F';
  ctx.strokeText('奶蛙大吃小', W / 2, ty);
  const tg = ctx.createLinearGradient(0, ty - 30, 0, ty + 30);
  tg.addColorStop(0, '#FFFFFF');
  tg.addColorStop(1, '#FFE57A');
  ctx.fillStyle = tg;
  ctx.fillText('奶蛙大吃小', W / 2, ty);

  if (!assetsReady) {
    ctx.fillStyle = '#2F5D24';
    ctx.font = `bold ${Math.round(18 * ui)}px ${FONT}`;
    ctx.fillText(`素材加载中 ${assetsLoaded}/${FROG_SOURCES.length} …`, W / 2, H * 0.5);
    return;
  }

  const heroSize = Math.min(compact ? 62 : 88, H * 0.19, W * 0.24);
  const heroY = compact ? H * 0.40 : H * 0.37;
  drawFrog(frogImages[PLAYER_VARIANT - 1], W / 2, heroY + Math.sin(time * 2) * 6, heroSize, Math.sin(time * 0.7) * 0.22, time, 0);
  // 主角周围画一圈无敌护盾示意
  ctx.save();
  ctx.strokeStyle = 'rgba(255,214,80,0.75)';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.arc(W / 2, heroY + Math.sin(time * 2) * 6, heroSize * 1.42, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  if (compact) {
    ctx.font = `bold ${Math.round(14 * ui)}px ${FONT}`;
    ctx.fillStyle = '#2F5D24';
    ctx.fillText('开局 10 秒无敌 · 吃掉小的躲开大的', W / 2, H * 0.57);
    ctx.fillStyle = '#0FA3C9';
    ctx.fillText('空格：闪电消灭最大奶蛙', W / 2, H * 0.57 + 23 * ui);
    ctx.fillStyle = '#F4511E';
    ctx.fillText('E 键：烈焰爆炸，范围全灭', W / 2, H * 0.57 + 46 * ui);
  } else {
    /* —— 五种表情变体展示 —— */
    const rowY = H * 0.62;
    const vs = Math.min(34, W * 0.072);
    const gap = Math.min(W * 0.18, 100);
    for (let i = 0; i < 5; i++) {
      const x = W / 2 + (i - 2) * gap;
      const face = x < W / 2 ? 0.12 : Math.PI - 0.12;
      drawFrog(frogImages[i], x, rowY + Math.sin(time * 2 + i) * 4, vs, face, time, i * 1.3);
      ctx.font = `${Math.round(12 * ui)}px ${FONT}`;
      ctx.fillStyle = 'rgba(47,93,36,0.85)';
      ctx.fillText(VARIANT_NAMES[i], x, rowY + vs + 20);
    }
    /* —— 玩法说明 —— */
    ctx.font = `bold ${Math.round(15 * ui)}px ${FONT}`;
    ctx.fillStyle = '#2F5D24';
    ctx.fillText('移动鼠标 / 滑动手指控制奶蛙 · 开局 10 秒无敌护盾', W / 2, H * 0.78);
    ctx.fillStyle = '#0FA3C9';
    ctx.fillText('空格 / 右下按钮：闪电，消灭场上最大的奶蛙', W / 2, H * 0.78 + 24 * ui);
    ctx.fillStyle = '#F4511E';
    ctx.fillText('E 键 / 右下按钮：烈焰爆炸，范围内全部炸飞', W / 2, H * 0.78 + 48 * ui);
  }

  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 3.2);
  ctx.font = `bold ${Math.round(19 * ui)}px ${FONT}`;
  ctx.fillStyle = '#1B5E20';
  ctx.fillText('点击任意位置开始游戏', W / 2, compact ? H * 0.78 : H * 0.94);
  ctx.globalAlpha = 1;
}

function drawPanel(panelW, panelH) {
  ctx.fillStyle = 'rgba(25,50,25,0.45)';
  ctx.fillRect(0, 0, W, H);
  const px = W / 2 - panelW / 2;
  const py = H / 2 - panelH / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = 'rgba(255,253,242,0.97)';
  rr(px, py, panelW, panelH, 24);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#B8D98C';
  ctx.lineWidth = 3;
  rr(px, py, panelW, panelH, 24);
  ctx.stroke();
  return { px, py };
}

function drawGameOver() {
  const ui = getUiScale();
  const pw = Math.min(430, W * 0.92);
  const ph = Math.min(400, H * 0.84);
  const { py } = drawPanel(pw, ph);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `bold ${Math.round(34 * ui)}px ${FONT}`;
  ctx.fillStyle = '#E0503F';
  ctx.fillText('被吃掉啦！', W / 2, py + 52 * ui);

  const ks = Math.min(50, ph * 0.17);
  drawFrog(frogImages[lastKiller.variant], W / 2, py + ph * 0.3 + Math.sin(time * 2) * 3, ks, -0.25, time, 2);

  ctx.font = `${Math.round(15 * ui)}px ${FONT}`;
  ctx.fillStyle = '#666';
  ctx.fillText(`凶手是一只体型 ${lastKiller.size} 的${VARIANT_NAMES[lastKiller.variant]}奶蛙`, W / 2, py + ph * 0.55);

  ctx.font = `bold ${Math.round(23 * ui)}px ${FONT}`;
  ctx.fillStyle = '#33691E';
  ctx.fillText('最终得分：' + score, W / 2, py + ph * 0.67);

  drawButton(W / 2, py + ph * 0.84, 190 * ui, 52 * ui, '重新开始', Math.round(20 * ui));
}

function drawWin() {
  const ui = getUiScale();
  const pw = Math.min(430, W * 0.92);
  const ph = Math.min(400, H * 0.84);
  const { py } = drawPanel(pw, ph);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `bold ${Math.round(34 * ui)}px ${FONT}`;
  ctx.fillStyle = '#F5A623';
  ctx.fillText('恭喜通关！', W / 2, py + 52 * ui);

  const fs = Math.min(58, ph * 0.16);
  const fy = py + ph * 0.3 + Math.sin(time * 2) * 3;
  drawFrog(frogImages[PLAYER_VARIANT - 1], W / 2, fy, fs, Math.sin(time * 0.9) * 0.12, time, 0);
  drawCrown(W / 2, fy - fs * 0.95, fs * 0.45);

  ctx.font = `${Math.round(17 * ui)}px ${FONT}`;
  ctx.fillStyle = '#555';
  ctx.fillText('你成为了池塘里最大的奶蛙王！', W / 2, py + ph * 0.56);

  ctx.font = `bold ${Math.round(22 * ui)}px ${FONT}`;
  ctx.fillStyle = '#33691E';
  ctx.fillText(`最终得分 ${score} · 体型 ${Math.round(player.size)}`, W / 2, py + ph * 0.68);

  drawButton(W / 2, py + ph * 0.84, 190 * ui, 52 * ui, '再来一局', Math.round(20 * ui));
}

function drawButton(cx, cy, w, h, label, fontSize) {
  const x = cx - w / 2, y = cy - h / 2;
  buttons.push({ x, y, w, h });
  const hover = mouse.active && mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.save();
  ctx.shadowColor = 'rgba(30,60,20,0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, hover ? '#8BC34A' : '#6FAE2E');
  g.addColorStop(1, hover ? '#6FAE2E' : '#5C9E31');
  ctx.fillStyle = g;
  rr(x, y, w, h, h / 2);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  rr(x, y, w, h, h / 2);
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${fontSize}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy + 1);
}

/* ===================== 窗口自适应 ===================== */
function onResize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initScenery();
  if (player) {
    player.x = clamp(player.x, 10, W - 10);
    player.y = clamp(player.y, 10, H - 10);
  }
  for (const n of npcs) {
    n.x = clamp(n.x, n.size, W - n.size);
    n.y = clamp(n.y, n.size, H - n.size);
  }
}

/* ===================== 主循环 ===================== */
function loop(ts) {
  const now = ts / 1000;
  const dt = clamp(now - lastTime, 0.001, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ===================== 启动 ===================== */
player = createPlayer();
onResize();
preloadAssets();
requestAnimationFrame(loop);
</script>
